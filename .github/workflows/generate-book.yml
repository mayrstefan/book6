name: Generate book
permissions:
  contents: read

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi mdformat requests tk xmltodict
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends pandoc texlive-latex-base
    - name: makeBook
      run: |
        python3 utilities/makeBook.py .
        cat makeBook.log
    - name: indexBook
      run: |
        python3 utilities/indexBook.py .
        cat indexBook.log
    - name: RFCbib6
      run: |
        python3 utilities/RFCbib6.py .
        cat RFCbib6.log
    - name: bakeeBook
      run: |
        python3 utilities/bakeBook.py .
        cat bakeBook.log
